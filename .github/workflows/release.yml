name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Set version from tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          npm version $version --no-git-tag-version

      - name: Build Windows installer + MSIX (unsigned)
        run: npm run dist -- -p never

      - name: Locate build artifacts
        id: artifacts
        shell: pwsh
        run: |
          $exe  = "dist/PackingRecorder-Setup.exe"
          $appx = Get-ChildItem dist -Filter "*.appx" | Select-Object -First 1 -ExpandProperty FullName
          echo "exe=$exe"          >> $env:GITHUB_OUTPUT
          echo "appx=$appx"        >> $env:GITHUB_OUTPUT
          echo "Found appx: $appx"

      - name: Create GitHub Release with installer and MSIX
        shell: pwsh
        run: |
          $installer = "dist/PackingRecorder-Setup.exe"
          # Recompute sha512/size so latest.yml always describes the exact file being
          # uploaded. Keeps the update feed self-consistent in case the installer is
          # ever post-processed before publishing.
          $file  = Get-Item -LiteralPath $installer
          $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
          $sha   = [System.Security.Cryptography.SHA512]::Create()
          $b64   = [System.Convert]::ToBase64String($sha.ComputeHash($bytes))
          $size  = $bytes.Length
          $yml   = [System.IO.File]::ReadAllText("dist/latest.yml")
          $yml   = $yml -replace '(sha512: ).*', ('${1}' + $b64)
          $yml   = $yml -replace '(size: ).*',   ('${1}' + $size)
          [System.IO.File]::WriteAllText("dist/latest.yml", $yml, (New-Object System.Text.UTF8Encoding($false)))
          $appx = "${{ steps.artifacts.outputs.appx }}"
          $files = @($installer, "dist/latest.yml")
          if ($appx -and (Test-Path $appx)) { $files += $appx }
          gh release create ${{ github.ref_name }} @files `
            --title "${{ github.ref_name }}" `
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify license server of new version
        shell: pwsh
        continue-on-error: true
        run: |
          Invoke-RestMethod -Uri "https://packingrecorder.com/set-version" `
            -Method POST `
            -Headers @{ "Authorization" = "Bearer ${{ secrets.VERSION_UPDATE_TOKEN }}"; "Content-Type" = "application/json" } `
            -Body (ConvertTo-Json @{ version = "${{ github.ref_name }}" })
